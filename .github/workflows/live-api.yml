name: Live API

# Runs the test suite against the real Paste.ee API (the "live API" testset in
# test/runtests.jl runs only when PASTEEE_APPKEY is set).
#
# Kept out of the CI workflow on purpose: the required check must not depend on
# a third-party service being up or on a secret that Dependabot PRs never get.
# This workflow instead reports drift in the real API on a schedule, and can be
# run by hand (e.g. after rotating the key).
on:
  schedule:
    - cron: '23 5 * * 1' # Mondays, 05:23 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    name: Live Paste.ee API
    runs-on: ubuntu-latest
    env:
      PASTEEE_APPKEY: ${{ secrets.PASTEEE_APPKEY }}
    steps:
      - name: Require PASTEEE_APPKEY
        run: |
          if [ -z "$PASTEEE_APPKEY" ]; then
            echo "::error::The PASTEEE_APPKEY secret is not set, so the live API cannot be tested."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: '1'
      - uses: julia-actions/julia-buildpkg@e3eb439fad4f9aba7da2667e7510e4a46ebc46e1 # v1.7.0
      - uses: julia-actions/julia-runtest@6e050c8013b833b1195105ff2fce9cd802f53271 # v1.12.0
        with:
          coverage: false
